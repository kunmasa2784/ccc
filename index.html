<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自治会課題診断ガイド</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chosen Palette: Calm Harmony -->
    <!-- Application Structure Plan: The SPA is now structured as a two-page application within a single file. A sticky header provides primary navigation between the "Diagnosis" page and the "Reference" page. This creates a clear separation of tasks for the user—first diagnose, then explore solutions. This structure directly addresses the user request for separation, making the tool's flow more logical and intuitive. The diagnosis results still link directly to the relevant section on the reference page, ensuring a seamless workflow. Gemini API features have been added to provide AI-powered action plans after diagnosis and to brainstorm further ideas within the reference library, transforming the tool from a static guide into a dynamic assistant. -->
    <!-- Visualization & Content Choices:
    - Main Navigation: Two buttons ("Diagnose", "View Countermeasures"). Goal: Separate the two main functions of the app. Viz/Method: Sticky header with HTML buttons. Interaction: Click to toggle visibility of the two main page divs. Justification: Provides clear, persistent navigation between the two core application modes.
    - Diagnosis Page: Contains the interactive questionnaire and results bar chart. Goal: Allow users to self-diagnose community issues. Viz/Method: HTML/JS questionnaire with 5-point Likert scale, Chart.js Bar Chart. Interaction: User answers questions; clicks results to switch to the reference page. Justification: Focuses the user on the task of diagnosis with more nuanced input.
    - AI Action Plan (New): After diagnosis, a button appears to generate a custom action plan based on the top challenges. Goal: Provide concrete, AI-generated next steps. Viz/Method: Button triggers Gemini API call with a structured JSON schema, results displayed in structured cards. Interaction: User clicks to get tailored, easy-to-read plans. Justification: Makes the diagnosis results immediately actionable and well-organized.
    - Reference Page: Contains the library of all challenges and countermeasures. Goal: Serve as a comprehensive knowledge base. Viz/Method: Accordion view. Interaction: Users can browse and expand topics. Justification: Acts as a standalone reference library.
    - AI Brainstorming & Announcement Helper (New): Within each countermeasure, two buttons allow users to ask for more ideas or draft an announcement. Goal: Deepen solutions and assist with communication. Viz/Method: Buttons trigger Gemini API calls, results shown below. Interaction: User clicks for creative ideas or communication drafts. Justification: Enhances static content with dynamic, practical AI assistance.
    - CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Meiryo', sans-serif;
            background-color: #FDFBF7; /* Warm off-white */
            color: #374151;
        }
        .main-nav-button {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .main-nav-button.active, .main-nav-button:hover {
            color: #A16207; /* Muted Gold */
            border-bottom-color: #A16207;
        }
        .nav-button {
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .nav-button.active, .nav-button:hover {
            color: #A16207;
            border-bottom-color: #A16207;
        }
        .accordion-header {
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .accordion-header:hover {
            background-color: #F3F4F6;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out, padding 0.5s ease-in-out;
            padding: 0 1.5rem;
        }
        .accordion-content.open {
            max-height: 2500px; /* Increased max-height */
            padding: 1rem 1.5rem 1.5rem 1.5rem;
        }
        .arrow-icon {
            transition: transform 0.3s ease;
        }
        .accordion-header.open .arrow-icon {
            transform: rotate(180deg);
        }
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        .diagnosis-container {
            min-height: 350px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #A16207;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .gemini-response { white-space: pre-wrap; font-size: 0.95rem; }
    </style>
</head>
<body class="antialiased">
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10">
        <nav class="container mx-auto max-w-6xl px-4 flex justify-center gap-8">
            <button id="nav-to-diagnosis" class="main-nav-button active">診断する</button>
            <button id="nav-to-reference" class="main-nav-button">対策を見る</button>
        </nav>
    </header>

    <div class="container mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">
        <div id="page-diagnosis">
             <header class="text-center mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-2">自治会課題診断ガイド</h1>
                <p class="text-gray-600">地域が直面する課題を理解し、未来への一歩を踏み出すための羅針盤</p>
            </header>
            <main>
                <section id="diagnosis" class="mb-12">
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div id="diagnosis-start">
                            <h2 class="text-2xl font-bold text-center text-gray-800 mb-3">かんたん地域診断</h2>
                            <p class="text-gray-600 text-center mb-6">いくつかの簡単な質問に答えるだけで、あなたの自治会が優先的に取り組むべき課題が見えてきます。</p>
                            <div class="text-center">
                                <button id="start-diagnosis-btn" class="bg-amber-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-amber-700 transition-colors">診断をはじめる</button>
                            </div>
                        </div>
                        
                        <div id="diagnosis-questions" class="hidden diagnosis-container">
                            <div id="progress-bar-container" class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                                <div id="progress-bar" class="bg-amber-600 h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                            <p id="question-counter" class="text-center text-sm text-gray-500 mb-4"></p>
                            <p id="question-text" class="text-lg font-semibold text-center mb-6 min-h-[3em]"></p>
                            <div id="answer-options" class="flex flex-wrap justify-center gap-3"></div>
                        </div>

                        <div id="diagnosis-results" class="hidden diagnosis-container">
                             <h2 class="text-2xl font-bold text-center text-gray-800 mb-3">診断結果</h2>
                             <p class="text-gray-600 text-center mb-6">あなたの自治会では、これらの課題への関心が高いようです。グラフをクリックして対策案を見てみましょう。</p>
                             <div class="chart-container" style="height:300px;">
                                 <canvas id="resultsBarChart"></canvas>
                             </div>
                             <div id="gemini-action-plan-container" class="text-center mt-6"></div>
                             <div class="text-center mt-6">
                                <button id="restart-diagnosis-btn" class="bg-gray-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-600 transition-colors">もう一度診断する</button>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <div id="page-reference" class="hidden">
            <header class="text-center mb-8">
                 <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-2">課題別 対策ライブラリ</h1>
                 <p class="text-gray-600 mt-2">各課題の詳細と具体的な対策案をいつでも確認できます。</p>
            </header>
            <main>
                <nav id="reference-nav" class="flex flex-wrap justify-center gap-x-4 gap-y-2 sm:gap-x-8 mb-10 border-b pb-3"></nav>
                <div id="content-area"></div>
            </main>
        </div>
        
        <footer class="text-center mt-12 text-gray-500 text-sm">
            <p>&copy; 2025 地域課題分析レポート. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        const appData = {
            "aging": {
                title: "I. 高齢化の進行",
                icon: '👴',
                intro: "高齢者が安心して暮らし続けられる、多世代にわたって支え合うコミュニティを目指します。",
                items: [
                    { q: "一人暮らし・高齢者のみの世帯が増加し、社会的孤立のリスクが高まっている。", a: "<b>【見守り・交流の強化】</b><br>・担当者を決めた定期的な声かけ・訪問活動（週1回など）。安否確認だけでなく、何気ない会話を大切にする。<br>・地域の郵便局、宅配業者、エネルギー事業者、ヤクルトレディ等と「ながら見守り」協定を結ぶ。<br>・高齢者が気軽に集えるサロンを、平日の日中に公民館や集会所で定期開催（例：毎週水曜日）。健康体操や懐メロの会など、目的を持たせると参加しやすい。<br>・デジタルツールを活用し、遠方の家族と繋がるための「スマホ・タブレット体験会」を実施する。" },
                    { q: "買い物、ゴミ出し、家の簡単な修繕など、日常生活での困りごとが増えている。", a: "<b>【生活支援サービスの創設】</b><br>・有償/無償の「お助け隊」を結成。電球交換、家具の移動、庭の草むしりなど、小さな困りごとに対応。<br>・地域の商店と連携した御用聞きや宅配サービスを立ち上げ、地域の経済循環にも貢献する。<br>・週に一度、主要なスーパーや病院を巡回する「乗り合い送迎サービス」を、地域のNPOや社会福祉協議会と連携して検討する。<br>・ゴミ出しのサポート体制を構築。近隣の住民が交代で支援する仕組みを作る。" },
                    { q: "災害発生時、自力での避難や情報収集が困難な人が増えている。", a: "<b>【要援護者への防災対策】</b><br>・民生委員と連携し「災害時要援護者リスト」を整備・定期更新。本人の同意を得て、支援者と情報を共有する。<br>・要援護者一人ひとりに対し、個別の避難支援計画（誰が、どこへ、どうやって）を作成し、関係者で共有・訓練を行う。<br>・固定電話や口コミ、防災行政無線の戸別受信機など、デジタルに頼らない情報伝達手段を複数確保し、訓練する。<br>・地域の避難所に、高齢者や障がい者向けの専用スペース（福祉避難スペース）を設置するよう行政に働きかける。" },
                    { q: "健康への不安や、認知症への心配を抱える人が多い。", a: "<b>【健康寿命を延ばす取り組み】</b><br>・毎日決まった時間に集まるラジオ体操や、気軽に参加できるウォーキング会を主催。参加者同士の交流も促す。<br>・地域包括支援センターと連携し、専門家による健康講座や認知症サポーター養成講座、栄養相談会を定期的に開催する。<br>・地域住民が主体となる「認知症カフェ」を運営し、本人・家族・地域住民が情報交換できる場を提供する。" }
                ]
            },
            "childcare": {
                title: "II. 子育て世代の動向の変化",
                icon: '👨‍👩‍👧‍👦',
                intro: "地域の未来を担う世代が参加しやすく、子育てを楽しめる環境を整えることが、地域の活力維持につながります。",
                items: [
                    { q: "共働き世帯が多く、平日の日中や夜間の会合に参加できない。", a: "<b>【参加のハードルを下げる工夫】</b><br>・総会や定例会は土日の午前中に設定し、1時間で終わるように事前に議題を共有し、進行を工夫する。<br>・Zoom等を活用したオンライン参加を標準とし、欠席者には議事録だけでなく、短いダイジェスト動画で内容を共有する。<br>・役員の役割を「会計」「広報」「イベント担当」など細分化・マニュアル化し、「単年度」「できることだけ」でも引き受けられるようにする。<br>・会合時に、ボランティアによる託児スペースを設ける。" },
                    { q: "自治会活動の必要性やメリットを感じていない。", a: "<b>【魅力の創出と活動の可視化】</b><br>・親子で楽しめる体験型イベント（防災キャンプ、ハロウィン、流しそうめん等）を企画・実施。子どもたちが企画段階から関われると、より主体性が高まる。<br>・会費がどのように使われているか（例：公園の遊具修繕費 〇〇円、防犯灯の電気代 〇〇円）を、イラストやグラフを用いて分かりやすく広報する。<br>・子育て世代に特化したアンケートを実施し、「自治会に何を求めているか」「どんなことなら協力できるか」を直接聞く。" },
                    { q: "地域の情報（病院、公園、習い事など）が不足しており、孤立しがち。", a: "<b>【情報提供とネットワーク作り】</b><br>・転入者向けに「子育てお役立ちマップ」を作成し、自治会への加入案内とともに配布。マップはオンライン版も用意し、随時更新する。<br>・地域限定で使えるLINEオープンチャットやSNSグループを開設し、リアルタイムでの情報交換や相談ができる場を提供する。<br>・不要になった育児用品やおもちゃの交換会・バザーを定期的に開催し、親同士の交流のきっかけを作る。" },
                    { q: "子どもの安全（交通、不審者）に対する不安が大きい。", a: "<b>【地域ぐるみでの安全・安心の確保】</b><br>・子どもたち自身が参加して、通学路の危険箇所をチェックする「安全マップ作りワークショップ」を実施する。<br>・「こども110番の家」の協力家庭を増やすと共に、子どもたちが実際に駆け込めるよう、日頃から協力家庭の大人と顔見知りになる機会を作る。<br>・長期休暇中に、地域の有志による学習支援や遊びの場を提供する「地域寺子屋」のような活動を検討する。" }
                ]
            },
            "environment": {
                title: "III. 住環境の変化",
                icon: '🏡',
                intro: "地域の景観や安全性は、住民の愛着や満足度に直結します。住み心地の良い環境を、住民の手で維持・向上させる取り組みが求められます。",
                items: [
                    { q: "空き家・空き地が増加し、管理不全（雑草、不法投棄）が目立つ。", a: "<b>【景観維持・環境美化活動】</b><br>・所有者の許可を得た上で、空き地を「みんなの花壇」や「コミュニティガーデン（菜園）」として活用する。<br>・定期的に地域一斉のクリーンデー（ゴミ拾い）を設け、作業後にお茶会を開くなど、交流の機会にも繋げる。<br>・不法投棄されやすい場所に、啓発看板だけでなく、地域の子どもたちが描いたポスターや花を飾ることで、「見られている」という意識を高める。" },
                    { q: "倒壊の危険があるブロック塀や、老朽化した空き家が放置され、防災・防犯上のリスクとなっている。", a: "<b>【危険箇所の把握と対策】</b><br>・地域内の危険箇所を定期的にパトロールし、「地域安全マップ」としてまとめ、所有者や行政と情報共有する。<br>・行政の補助金制度（ブロック塀の撤去費用補助など）を調査し、分かりやすくまとめたチラシを作成して所有者に情報提供する。<br>・夜間のパトロール活動や、防犯灯の増設・LED化を行政に働きかける。住民の要望として具体的に示すことが重要。" },
                    { q: "空き家が地域の資産として活用されていない。", a: "<b>【地域資源としての利活用】</b><br>・行政の「空き家バンク」制度と連携し、移住・定住希望者への情報発信を協力する。<br>・所有者と交渉し、空き家を地域のコミュニティスペース、子どもたちの遊び場、防災倉庫、アーティストの滞在制作場所などとして活用できないか検討する。<br>・改修が必要な場合、DIYワークショップ形式で住民が関わることで、コストを抑えつつコミュニティの拠点として愛着を醸成する。" }
                ]
            },
            "diversity": {
                title: "IV. 住民の多様化",
                icon: '🌍',
                intro: "様々な背景を持つ人々が共に安心して暮らせる社会を目指し、誰もが尊重され、円滑なコミュニケーションが図れる地域を作ります。",
                items: [
                    { q: "外国籍住民が増え、言語や文化の違いからゴミ出しや騒音などのトラブルが発生している。", a: "<b>【多文化共生とルール共有の促進】</b><br>・ゴミ出しの分別や収集日、騒音に関する注意点を、やさしい日本語と多言語（英語、中国語、ベトナム語等）で併記した案内を作成・配布する。イラストや写真を多用し、直感的に理解できるデザインを心がける。<br>・市の国際交流協会や地域のNPOと連携し、通訳ボランティアの派遣や、生活オリエンテーションの共同開催を依頼する。<br>・トラブルが起きた際に一方的に注意するのではなく、なぜそのルールがあるのか背景や文化を丁寧に説明する場を設ける。" },
                    { q: "日本の地域文化や自治会の活動内容が伝わらず、交流の機会が少ない。", a: "<b>【文化交流の機会創出】</b><br>・お互いの国の料理を持ち寄る国際交流パーティや、各国の遊びを紹介するイベントを企画する。<br>・餅つき、七夕、盆踊りなど、日本の伝統文化を一緒に体験する機会を作る。体験が目的のため、準備や片付けの負担は最小限にする。<br>・防災訓練に外国籍住民も参加できるよう、積極的に声をかけ、多言語での説明やピクトグラムを用意する。" },
                    { q: "単身者や学生など、自治会との関わりが薄い層が増加している。", a: "<b>【多様な関わり方の提供】</b><br>・役員や班長といった役割だけでなく、「イベント時だけ」「得意なことだけ（IT支援、デザイン作成など）」といったスポットでのボランティア「サポーター制度」を導入する。<br>・会費の使い道や活動の成果をSNSやウェブサイトで積極的に発信し、自治会活動の意義と価値を伝える。<br>・若い世代や特定の趣味を持つ住民が、自分たちの興味関心に基づいたイベント（例：eスポーツ大会、ボードゲーム会）を企画・運営できるよう支援する。" }
                ]
            },
            "disaster": {
                title: "V. 防災・減災への要請の高まり",
                icon: '⚠️',
                intro: "気候変動の影響による災害の激甚化・頻発化に対応するため、「自分たちのまちは自分たちで守る」という、より主体的な防災・減災活動が不可欠です。",

        async function callGeminiAPI(prompt, generationConfig = null) {
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                ...(generationConfig && { generationConfig })
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts.length > 0) {
                    return result.candidates[0].content.parts[0].text;
                } else {
                     return "AIからの有効な回答を得られませんでした。";
                }
            } catch (error) {
                console.error("Gemini API call failed:", error);
                return "AIとの通信中にエラーが発生しました。";
            }
        }
        
        function formatGeminiResponse(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') // Bold
                .replace(/\*/g, '') // Remove asterisks used for lists
                .replace(/・/g, '<br>・') // Add line breaks for bullet points
                .replace(/\n/g, '<br>'); // Newlines
        }

        async function generateActionPlan() {
            const outputContainer = document.getElementById('gemini-plan-output');
            outputContainer.innerHTML = '<div class="loader"></div>';

            const topChallenges = sortedResultKeys.map(key => appData[key].title.split('. ')[1]);
            const prompt = `あなたは日本の自治会運営に非常に詳しい専門コンサルタントです。
以下の課題について、一般的な自治会が明日からでも始められるような、具体的で実行可能なアクションプランを2つ、JSON形式で提案してください。
各プランには、title, objective, steps (箇条書きの配列), resources, timeline, success_metricを含めてください。

課題: ${topChallenges.join('、')}`;

            const generationConfig = {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        "plans": {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    "title": { "type": "STRING" },
                                    "objective": { "type": "STRING" },
                                    "steps": { "type": "ARRAY", "items": { "type": "STRING" } },
                                    "resources": { "type": "STRING" },
                                    "timeline": { "type": "STRING" },
                                    "success_metric": { "type": "STRING" }
                                }
                            }
                        }
                    }
                }
            };
            
            const responseText = await callGeminiAPI(prompt, generationConfig);
            
            try {
                const parsedJson = JSON.parse(responseText);
                renderActionPlans(parsedJson.plans, outputContainer);
            } catch (e) {
                console.error("Failed to parse JSON response:", e);
                outputContainer.innerHTML = `<div class="p-4 bg-red-100 rounded-lg text-red-700">AIからの応答を解析できませんでした。</div>`;
            }
        }

        function renderActionPlans(plans, container) {
            if (!plans || plans.length === 0) {
                 container.innerHTML = `<div class="p-4 bg-gray-100 rounded-lg">AIから具体的なプランの提案がありませんでした。</div>`;
                 return;
            }
            let html = '<div class="space-y-4">';

                html += `

                            <p><b>スケジュール案:</b> ${plan.timeline}</p>
                            <p><b>成功の目安:</b> ${plan.success_metric}</p>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function getMoreIdeas(problem, existingSolution, outputId) {
            const outputContainer = document.getElementById(outputId);
            outputContainer.innerHTML = '<div class="loader" style="width:20px; height:20px; border-width: 2px;"></div>';
            outputContainer.classList.remove('hidden');

            const prompt = `あなたは地域活性化の専門家で、ユニークなアイデアを出すのが得意です。
以下の状況について、記載されている対策以外に、住民が楽しく参加できるような、あるいは少し変わった視点からのアイデアを2つ提案してください。各アイデアは簡潔にお願いします。

【現象】: ${problem}
【既存の対策】: ${existingSolution}`;
            
            const responseText = await callGeminiAPI(prompt);
            outputContainer.innerHTML = `<div class="gemini-response p-2">${formatGeminiResponse(responseText)}</div>`;
        }

        async function generateAnnouncement(problem, solution, outputId) {
            const outputContainer = document.getElementById(outputId);
            outputContainer.innerHTML = '<div class="loader" style="width:20px; height:20px; border-width: 2px;"></div>';
            outputContainer.classList.remove('hidden');

            const prompt = `あなたは日本の自治会で広報を担当している、親しみやすいスタッフです。
以下の課題と対策をテーマにして、地域の住民が参加したくなるような、温かみのある告知文案を作成してください。
特に新しい住民や若い世代にも響くような、ポジティブで分かりやすい言葉を選んでください。

【テーマとなる課題】: ${problem}
【実施する対策】: ${solution}

上記の情報を元に、掲示板や回覧板、LINEグループで使えるような告知文を作成してください。`;
            
            const responseText = await callGeminiAPI(prompt);
            outputContainer.innerHTML = `<div class="gemini-response p-2">${formatGeminiResponse(responseText)}</div>`;
        }


    </script>
